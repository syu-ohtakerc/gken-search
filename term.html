<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>用語の詳しい解説</title>
<style>
:root{color-scheme:light;--bg:#f4f5f7;--card:#fff;--text:#1c2230;--sub:#596477;--line:#d9dde5;--accent:#2a55d9;--accent-soft:#e7edff;--on-accent:#fff;--ok:#0b6e5f;--ok-soft:#e0f4ef;--ng:#b3203f;--ng-soft:#ffe6eb;--warn:#8a5a00;--warn-soft:#fff3d6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.8 "Segoe UI","Yu Gothic UI","Meiryo",sans-serif}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 40px}
nav{padding:12px 0;display:flex;flex-wrap:wrap;gap:8px}
a.btn,button.btn{display:inline-block;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);text-decoration:none;font:inherit;font-size:14px;cursor:pointer}
a.btn:hover,button.btn:hover{border-color:var(--accent)}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 18px;margin:12px 0}
h1{font-size:22px;margin:4px 0;line-height:1.4;overflow-wrap:anywhere}
h2{font-size:16px;margin:4px 0 8px;color:var(--accent)}
.meta{font-size:12px;color:var(--sub)}
.imp{color:#8f6300}
.detail p{margin:6px 0;overflow-wrap:anywhere}
.choice{display:block;width:100%;text-align:left;margin:8px 0;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit;cursor:pointer;overflow-wrap:anywhere}
.choice:hover:not(:disabled){border-color:var(--accent)}
.choice.ok{background:var(--ok-soft);border-color:var(--ok)}
.choice.ng{background:var(--ng-soft);border-color:var(--ng)}
.q{white-space:pre-wrap;overflow-wrap:anywhere}
.expl{margin-top:10px;padding:8px 12px;background:var(--accent-soft);border-radius:8px;white-space:pre-wrap;overflow-wrap:anywhere}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;min-width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 9px;vertical-align:top;text-align:left;overflow-wrap:anywhere}
thead th{background:var(--accent-soft)}
tbody th{background:var(--accent-soft);white-space:nowrap}
.note{font-size:12px;background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:6px 10px;margin:8px 0}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a class="btn" href="./">← 用語検索へ戻る</a>
    <a class="btn" id="prev" href="#" hidden>← 前の用語</a>
    <a class="btn" id="next" href="#" hidden>次の用語 →</a>
  </nav>
  <div id="root">読み込み中…</div>
</div>
<script src="data.js"></script>
<script>
(function(){
  'use strict';
  var root=document.getElementById('root');
  var PARTS=6;
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  var no=parseInt(new URLSearchParams(location.search).get('no'),10);
  var list=GLOSSARY.filter(function(g){return g.imp!=='－';});
  var g=GLOSSARY.filter(function(x){return x.no===no;})[0];
  if(!g){root.textContent='用語が見つかりません。';return;}
  document.title=g.term+'｜用語の詳しい解説';
  var idx=list.findIndex(function(x){return x.no===no;});
  function nav(id,item){var a=document.getElementById(id);if(item){a.href='term.html?no='+item.no;a.title=item.term;a.hidden=false;}}
  if(idx>0)nav('prev',list[idx-1]);
  if(idx>=0&&idx<list.length-1)nav('next',list[idx+1]);

  function header(){
    return '<section><h1>'+esc(g.term)+(g.imp!=='－'?' <span class="imp">'+esc(g.imp)+'</span>':'')+'</h1>'+
      '<p>'+esc(g.desc)+'</p><div class="meta">'+esc(g.field)+(g.syl!=='－'?'・'+esc(g.syl):'')+'・No.'+g.no+'</div></section>';
  }
  function load(k){
    return fetch('details/part_'+k+'.json').then(function(r){return r.ok?r.json():{};}).catch(function(){return {};});
  }
  function loadCmp(k){
    return fetch('details/cmp_'+k+'.json').then(function(r){return r.ok?r.json():{};}).catch(function(){return {};});
  }
  function cmpHtml(c){
    if(!c||!c.head||!c.rows)return '';
    var h='<section><h2>'+esc(c.title||'似た用語との比較')+'</h2><div class="tblwrap"><table><thead><tr>'+
      c.head.map(function(x){return '<th>'+esc(x)+'</th>';}).join('')+'</tr></thead><tbody>'+
      c.rows.map(function(r){return '<tr>'+r.map(function(x,i){return (i===0?'<th>':'<td>')+esc(x)+(i===0?'</th>':'</td>');}).join('')+'</tr>';}).join('')+
      '</tbody></table></div></section>';
    return h;
  }
  var ps=[],cs=[];for(var i=1;i<=PARTS;i++){ps.push(load(i));cs.push(loadCmp(i));}
  Promise.all([Promise.all(ps),Promise.all(cs)]).then(function(res){
    var arr=res[0],carr=res[1];
    var d=null;arr.forEach(function(o){if(o&&o[String(no)])d=o[String(no)];});
    var cmp=null;carr.forEach(function(o){if(o&&o[String(no)])cmp=o[String(no)];});
    if(!d){root.innerHTML=header()+'<section><p>この用語の詳しい解説はまだありません。</p></section>';return;}
    var html=header();
    html+='<section class="detail"><h2>詳しい解説</h2>'+esc(d.detail).split('\n').filter(Boolean).map(function(p){return '<p>'+p+'</p>';}).join('')+'</section>';
    html+=cmpHtml(cmp);
    var q=d.q;
    html+='<section><h2>予想問題('+esc(q.type)+')</h2><div class="note">この問題は用語から推測して作成した予想問題で、実際の過去問ではありません。</div>'+
      '<div class="q">'+esc(q.question)+'</div><div id="choices"></div><div id="result"></div></section>';
    root.innerHTML=html;
    var box=document.getElementById('choices'),res=document.getElementById('result');
    var btns=[];
    q.choices.forEach(function(c,i){
      var b=document.createElement('button');b.type='button';b.className='choice';
      b.textContent=(i+1)+'. '+c;
      b.addEventListener('click',function(){
        btns.forEach(function(x,j){x.disabled=true;if(j===q.ans)x.classList.add('ok');});
        if(i!==q.ans)b.classList.add('ng');
        res.innerHTML='<div class="expl"><b>'+(i===q.ans?'正解です。':'不正解です。正解は '+(q.ans+1)+' です。')+'</b>\n'+esc(q.expl)+'</div>';
      });
      btns.push(b);box.appendChild(b);
    });
  });
})();
</script>
</body>
</html>
